# Профиль docker: адреса внутри сети Compose. Секреты монтируются в /run/secrets (FITCLUB_SECRETS_DIR).
server:
  port: 8080

spring:
  datasource:
    url: ${FITCLUB_DB_URL:jdbc:postgresql://postgres:5432/payment_db}
  rabbitmq:
    host: ${FITCLUB_RABBITMQ_HOST:rabbitmq}

fitclub:
  payment:
    membership:
      base-url: ${FITCLUB_MEMBERSHIP_URL:http://membership-service:8080}
