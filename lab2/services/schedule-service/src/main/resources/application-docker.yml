# Профиль docker: адреса внутри сети Compose. Секреты монтируются в /run/secrets (FITCLUB_SECRETS_DIR).
server:
  port: 8080

spring:
  datasource:
    url: ${FITCLUB_DB_URL:jdbc:postgresql://postgres:5432/schedule_db}
  rabbitmq:
    host: ${FITCLUB_RABBITMQ_HOST:rabbitmq}

fitclub:
  schedule:
    auth:
      base-url: ${FITCLUB_AUTH_URL:http://auth-service:8080}
