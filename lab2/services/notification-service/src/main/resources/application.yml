# FitClub Notification Service
# Профили:
#   local  (по умолчанию) — запуск из IDE/терминала, инфраструктура в Docker на localhost;
#   docker — запуск в Docker Compose (имена контейнеров, порт 8080, секреты в /run/secrets);
#   demo   — дополнительно к docker: demo-возможности (появятся на следующих шагах);
#   test   — автотесты (Testcontainers).
# Технические настройки по умолчанию (логи, health, JSON) — libs/fitclub-common/.../fitclub-defaults.properties
spring:
  application:
    name: notification-service
  profiles:
    default: local
  config:
    # Каждый файл каталога секретов становится свойством с именем файла (db_notification_password и т.д.)
    import: optional:configtree:${FITCLUB_SECRETS_DIR:secrets}/
  rabbitmq:
    host: ${FITCLUB_RABBITMQ_HOST:localhost}
    port: ${FITCLUB_RABBITMQ_PORT:5672}
    username: notification_service
    password: ${rabbitmq_notification_password}
  datasource:
    url: ${FITCLUB_DB_URL:jdbc:postgresql://localhost:5432/notification_db}
    username: ${FITCLUB_DB_USER:notification_user}
    password: ${db_notification_password}

server:
  port: ${PORT:8086}

# Notification только потребляет события: outbox не используется, в группе messaging только брокер
management:
  endpoint:
    health:
      group:
        messaging:
          include: rabbit

fitclub:
  openapi:
    title: "FitClub Notification Service"
    description: "Внутренние уведомления, отметка прочтения и сохраняемые напоминания."
  security:
    jwt-public-key: file:${FITCLUB_SECRETS_DIR:secrets}/jwt_public_key.pem
    issuer: fitclub-auth
    audience: fitclub-api
    public-paths: []
  internal:
    # Внутреннего API у сервиса нет: любой запрос к /internal/** получит 401
    clients: []
  outbox:
    enabled: false
  notification:
    # Своя очередь потребителя (topology.json): MembershipActivated, BookingConfirmed, BookingCancelled
    events-queue: notification-service.events
    display-zone: Europe/Chisinau
    # За сколько до начала занятия напомнить (REMINDER_LEAD_MINUTES)
    reminder-lead: ${REMINDER_LEAD_MINUTES:60}m
    reminders:
      scheduler-enabled: true
      poll-interval: 15s
      batch-size: 50
