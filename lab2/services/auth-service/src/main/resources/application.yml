# FitClub Auth Service
# Профили:
#   local  (по умолчанию) — запуск из IDE/терминала, инфраструктура в Docker на localhost;
#   docker — запуск в Docker Compose (имена контейнеров, порт 8080, секреты в /run/secrets);
#   demo   — дополнительно к docker: demo-возможности (появятся на следующих шагах);
#   test   — автотесты (Testcontainers).
# Технические настройки по умолчанию (логи, health, JSON) — libs/fitclub-common/.../fitclub-defaults.properties
spring:
  application:
    name: auth-service
  profiles:
    default: local
  config:
    # Каждый файл каталога секретов становится свойством с именем файла (db_auth_password и т.д.)
    import: optional:configtree:${FITCLUB_SECRETS_DIR:secrets}/
  datasource:
    url: ${FITCLUB_DB_URL:jdbc:postgresql://localhost:5432/auth_db}
    username: ${FITCLUB_DB_USER:auth_user}
    password: ${db_auth_password}

server:
  port: ${PORT:8081}

fitclub:
  openapi:
    title: "FitClub Auth Service"
    description: "Учётные записи, вход, access/refresh токены, роли и минимальный профиль."
  security:
    jwt-public-key: file:${FITCLUB_SECRETS_DIR:secrets}/jwt_public_key.pem
    issuer: fitclub-auth
    audience: fitclub-api
    public-paths:
      - /api/auth/register
      - /api/auth/login
      - /api/auth/refresh
      # logout принимает refresh-токен в теле: владение токеном и есть подтверждение
      - /api/auth/logout
  internal:
    clients:
      - name: schedule-service
        token: ${service_token_schedule_to_auth}
        paths:
            - /internal/users/**
  auth:
    jwt-private-key: file:${FITCLUB_SECRETS_DIR:secrets}/jwt_private_key.pem
    access-token-ttl: 15m
    refresh-token-ttl: 7d
    # Первый администратор (явный bootstrap): создаётся, только если есть секрет auth_initial_admin_password
    initial-admin:
      email: ${FITCLUB_AUTH_INITIAL_ADMIN_EMAIL:admin@fitclub.local}
      password: ${auth_initial_admin_password:}
      display-name: "Администратор клуба"
