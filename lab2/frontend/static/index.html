<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>FitClub</title>
    <link rel="stylesheet" href="/css/app.css">
    <script type="module" src="/js/app.js"></script>
</head>
<body>
<header class="topbar">
    <div class="brand">Fit<span>Club</span></div>
    <nav id="nav" class="nav" hidden></nav>
    <div id="session" class="session" hidden>
        <button id="bell" class="bell" type="button" title="Уведомления">
            Уведомления <span id="unread" class="badge" hidden>0</span>
        </button>
        <span id="whoami" class="whoami"></span>
        <button id="logout" class="link" type="button">Выйти</button>
    </div>
</header>

<main id="view" class="view" aria-live="polite">
    <p class="muted">Загрузка…</p>
</main>

<div id="toast" class="toast" role="status" hidden></div>

<footer class="footer">
    Учебный проект. Оплата — тестовый симулятор: деньги не списываются, данные карты не запрашиваются.
    Время указано по Кишинёву. <a href="/swagger-ui.html" target="_blank" rel="noopener">API (Swagger)</a>

</html>
