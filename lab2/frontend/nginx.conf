# FitClub UI: статика + проксирование /api в Gateway с того же origin.
# Браузер обращается только сюда: в БД, RabbitMQ и внутренние endpoint'ы сервисов прямых запросов нет.
server {
    listen 80;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    # Встроенный DNS Docker: Gateway может стартовать позже Nginx, имя разрешается при запросе
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $gateway http://gateway:8080;

    # Скрипты и стили — только свои файлы; токены не уходят на сторонние домены
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # Внутренние маршруты сервисов снаружи не существуют (Gateway их тоже не публикует)
    location /internal/ {
        return 404;
    }

    location /api/ {
        proxy_pass $gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_connect_timeout 3s;
        proxy_read_timeout 20s;
        # Ответы API (в том числе ошибки) не кэшируются. add_header внутри location заменяет заголовки сервера,
        # поэтому nosniff повторён здесь
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        proxy_intercept_errors off;
        error_page 502 503 504 = @gateway_down;
    }

    # Общий Swagger UI Gateway и OpenAPI сервисов — с того же адреса, что и UI
    location ~ ^/(swagger-ui\.html|swagger-ui/|webjars/|v3/api-docs|docs/) {
        proxy_pass $gateway;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        error_page 502 503 504 = @gateway_down;
    }

    # Gateway недоступен: тот же формат problem+json, что и у сервисов
    location @gateway_down {
        default_type application/problem+json;
        add_header Cache-Control "no-store" always;
        return 503 '{"type":"https://fitclub.local/problems/dependency-unavailable","title":"Сервис временно недоступен","status":503,"detail":"API временно недоступно. Повторите попытку позже.","code":"DEPENDENCY_UNAVAILABLE"}';
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css)$ {
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
}
