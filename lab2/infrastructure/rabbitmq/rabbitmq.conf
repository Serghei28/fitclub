# Топология (exchange, очереди, bindings) и пользователи импортируются при каждом старте брокера.
# Каталог содержит два файла:
#   10-topology.json - декларации из Git (infrastructure/rabbitmq/topology.json);
#   00-users.json    - сгенерированные пользователи с хешами паролей (secrets/rabbitmq_users.json).
# Поэтому очереди потребителей существуют, даже если сами потребители ещё не запущены.
definitions.import_backend = local_filesystem
definitions.local.path = /etc/rabbitmq/definitions.d

# Учётная запись guest работает только с localhost внутри контейнера
loopback_users.guest = true

log.console = true
log.console.level = info
