# Настройки RabbitMQ по умолчанию для сервисов с событиями (низший приоритет, переопределяются сервисом).

# Виртуальный хост и topic exchange из infrastructure/rabbitmq/topology.json
spring.rabbitmq.virtual-host=fitclub
fitclub.outbox.exchange=fitclub.events

# Publisher confirms + returns: событие считается отправленным только после ack брокера
# и только если оно не вернулось как unroutable (mandatory=true)
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true
spring.rabbitmq.connection-timeout=3s

# Топологию создаёт инфраструктура: приложение не объявляет exchange/queue (у его пользователя нет прав configure)
spring.rabbitmq.dynamic=false

# Состояние доставки событий — отдельная группа, НЕ часть /ready
management.endpoint.health.group.messaging.include=rabbit,outbox
management.endpoint.health.group.messaging.show-components=always
