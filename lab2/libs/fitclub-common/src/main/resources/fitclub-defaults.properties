# Технические настройки по умолчанию, одинаковые для всех servlet-сервисов FitClub.
# Подключаются FitClubDefaultsEnvironmentPostProcessor с НИЗШИМ приоритетом:
# application.yml сервиса и переменные окружения могут переопределить любое значение.

# --- JSON-логи в stdout: timestamp, service, level, request_id, message (+ logger_name, thread_name, stack_trace)
logging.structured.format.console=logstash
logging.structured.json.rename[@timestamp]=timestamp
logging.structured.json.add.service=${spring.application.name}
logging.structured.json.exclude=@version,level_value
spring.main.banner-mode=off

# --- JSON API: snake_case и без null-полей
spring.jackson.property-naming-strategy=SNAKE_CASE
spring.jackson.default-property-inclusion=non_null

# --- Ошибки: формат problem+json формирует GlobalExceptionHandler, стандартный Spring отключён
spring.mvc.problemdetails.enabled=false
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-exception=false

# --- БД: схему создаёт только Flyway, Hibernate проверяет соответствие сущностей
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.validation-timeout=2000
spring.datasource.hikari.maximum-pool-size=10

# --- Health: /health = liveness процесса, /ready = готовность (своя БД + миграции)
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.endpoint.health.show-components=always
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.liveness.additional-path=server:/health
management.endpoint.health.group.liveness.show-components=always
management.endpoint.health.group.readiness.include=readinessState,db,migrations
management.endpoint.health.group.readiness.additional-path=server:/ready
management.endpoint.health.group.readiness.show-components=always

# --- OpenAPI / Swagger UI (dev/demo режим, см. docs/api.md)
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.show-actuator=false
