spring.application.name=common-test
# Тестовое приложение модуля common не использует БД
spring.autoconfigure.exclude=org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration,org.springframework.boot.flyway.autoconfigure.FlywayAutoConfiguration
management.endpoint.health.validate-group-membership=false

fitclub.security.issuer=fitclub-auth
fitclub.security.audience=fitclub-api
fitclub.security.public-paths=/api/public/**

fitclub.internal.clients[0].name=payment-service
fitclub.internal.clients[0].token=payment-token-0123456789-0123456789-abcdef
fitclub.internal.clients[0].paths=/internal/orders/**
fitclub.internal.clients[1].name=booking-service
fitclub.internal.clients[1].token=booking-token-0123456789-0123456789-abcdef
fitclub.internal.clients[1].paths=/internal/eligibility/**
