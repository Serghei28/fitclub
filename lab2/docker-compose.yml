# FitClub: локальное окружение.
# Инфраструктура (PostgreSQL + bootstrap БД, RabbitMQ с топологией), шесть бизнес-сервисов и API Gateway
# (http://localhost:8000). UI добавляется на шаге 10 (docs/progress.md). Порты сервисов публикуются только
# dev-override: docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
#
# Перед первым запуском сгенерируйте секреты (см. README, раздел «Первый запуск»).
# Остановка без потери данных: docker compose down   (НЕ используйте -v: он удаляет volumes)

name: fitclub

x-postgres-image: &postgres-image postgres:17.11-alpine

services:
  postgres:
    image: *postgres-image
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_admin_password
      POSTGRES_DB: postgres
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --encoding=UTF8"
      TZ: UTC
    secrets:
      - postgres_admin_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      # Порт открыт только для локальной машины: нужен для запуска сервисов из IDE и для psql
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # Одноразовый идемпотентный bootstrap: роли и логические БД сервисов.
  # Выполняется при каждом `up` и завершается; сервисы ждут его успешного завершения.
  postgres-bootstrap:
    image: *postgres-image
    entrypoint: ["sh", "/bootstrap/bootstrap-databases.sh"]
    environment:
      PGHOST: postgres
      PGUSER: postgres
    secrets:
      - postgres_admin_password
      - db_auth_password
      - db_schedule_password
      - db_membership_password
      - db_booking_password
      - db_payment_password
      - db_notification_password
    volumes:
      - ./infrastructure/postgres:/bootstrap:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  rabbitmq:
    image: rabbitmq:4.1.8-management-alpine
    # Постоянное имя узла: данные RabbitMQ в volume привязаны к имени хоста
    hostname: rabbitmq
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - ./infrastructure/rabbitmq/rabbitmq.conf:/etc/rabbitmq/conf.d/90-fitclub.conf:ro
      - ./infrastructure/rabbitmq/topology.json:/etc/rabbitmq/definitions.d/10-topology.json:ro
    secrets:
      # Через secrets, а не bind mount: при отсутствии файла Compose сообщит об ошибке,
      # а не создаст вместо него пустой каталог
      - source: rabbitmq_users
        target: /etc/rabbitmq/definitions.d/00-users.json
    ports:
      - "127.0.0.1:${RABBITMQ_HOST_PORT:-5672}:5672"
      # Management UI: http://localhost:15672, пользователь fitclub_admin
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_HOST_PORT:-15672}:15672"
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q check_running && rabbitmq-diagnostics -q check_local_alarms"]
      interval: 10s
      timeout: 10s
      retries: 18
      start_period: 20s
    restart: unless-stopped

  # --- Бизнес-сервисы: собираются из исходников, у каждого своя БД и свои секреты ---
  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    image: fitclub/auth-service:1.0.0
    environment:
      # docker — рабочий режим; docker,demo — учебный стенд (тестовая оплата, demo-данные), см. .env.example
      SPRING_PROFILES_ACTIVE: ${FITCLUB_PROFILES:-docker}
      FITCLUB_SECRETS_DIR: /run/secrets
      # Первый администратор; пароль — секрет auth_initial_admin_password
      FITCLUB_AUTH_INITIAL_ADMIN_EMAIL: ${FITCLUB_AUTH_INITIAL_ADMIN_EMAIL:-admin@fitclub.local}
      # Адрес собственной БД можно заменить, например на отдельный сервер PostgreSQL:
      # FITCLUB_DB_URL: jdbc:postgresql://other-host:5432/auth_db
    secrets:
      - db_auth_password
      - source: jwt_public_key
        target: jwt_public_key.pem
      # Закрытый ключ подписи JWT монтируется только в auth-service
      - source: jwt_private_key
        target: jwt_private_key.pem
      - auth_initial_admin_password
      - service_token_schedule_to_auth
    depends_on:
      postgres-bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/ready >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    restart: unless-stopped

  schedule-service:
    build:
      context: .
      dockerfile: services/schedule-service/Dockerfile
    image: fitclub/schedule-service:1.0.0
    environment:
      # docker — рабочий режим; docker,demo — учебный стенд (тестовая оплата, demo-данные), см. .env.example
      SPRING_PROFILES_ACTIVE: ${FITCLUB_PROFILES:-docker}
      FITCLUB_SECRETS_DIR: /run/secrets
      # Адрес собственной БД можно заменить, например на отдельный сервер PostgreSQL:
      # FITCLUB_DB_URL: jdbc:postgresql://other-host:5432/schedule_db
    secrets:
      - db_schedule_password
      - source: jwt_public_key
        target: jwt_public_key.pem
      # Пароль своего пользователя RabbitMQ и токен исходящих вызовов schedule → auth
      - rabbitmq_schedule_password
      - service_token_schedule_to_auth
    depends_on:
      postgres-bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/ready >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    restart: unless-stopped

  membership-service:
    build:
      context: .
      dockerfile: services/membership-service/Dockerfile
    image: fitclub/membership-service:1.0.0
    environment:
      # docker — рабочий режим; docker,demo — учебный стенд (тестовая оплата, demo-данные), см. .env.example
      SPRING_PROFILES_ACTIVE: ${FITCLUB_PROFILES:-docker}
      FITCLUB_SECRETS_DIR: /run/secrets
      # Адрес собственной БД можно заменить, например на отдельный сервер PostgreSQL:
      # FITCLUB_DB_URL: jdbc:postgresql://other-host:5432/membership_db
    secrets:
      - db_membership_password
      - source: jwt_public_key
        target: jwt_public_key.pem
      # Свой пользователь RabbitMQ: читает membership-service.events, публикует MembershipActivated
      - rabbitmq_membership_password
      - service_token_payment_to_membership
      - service_token_booking_to_membership
    depends_on:
      postgres-bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/ready >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    restart: unless-stopped

  booking-service:
    build:
      context: .
      dockerfile: services/booking-service/Dockerfile
    image: fitclub/booking-service:1.0.0
    environment:
      # docker — рабочий режим; docker,demo — учебный стенд (тестовая оплата, demo-данные), см. .env.example
      SPRING_PROFILES_ACTIVE: ${FITCLUB_PROFILES:-docker}
      FITCLUB_SECRETS_DIR: /run/secrets
      # Адрес собственной БД можно заменить, например на отдельный сервер PostgreSQL:
      # FITCLUB_DB_URL: jdbc:postgresql://other-host:5432/booking_db
    secrets:
      - db_booking_password
      - source: jwt_public_key
        target: jwt_public_key.pem
    depends_on:
      postgres-bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/ready >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    restart: unless-stopped

  payment-service:
    build:
      context: .
      dockerfile: services/payment-service/Dockerfile
    image: fitclub/payment-service:1.0.0
    environment:
      # docker — рабочий режим; docker,demo — учебный стенд (тестовая оплата, demo-данные), см. .env.example
      SPRING_PROFILES_ACTIVE: ${FITCLUB_PROFILES:-docker}
      FITCLUB_SECRETS_DIR: /run/secrets
      # Адрес собственной БД можно заменить, например на отдельный сервер PostgreSQL:
      # FITCLUB_DB_URL: jdbc:postgresql://other-host:5432/payment_db
    secrets:
      - db_payment_password
      - source: jwt_public_key
        target: jwt_public_key.pem
      # Свой пользователь RabbitMQ и токен исходящих вызовов payment → membership
      - rabbitmq_payment_password
      - service_token_payment_to_membership
    depends_on:
      postgres-bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/ready >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    restart: unless-stopped

  notification-service:
    build:
      context: .
      dockerfile: services/notification-service/Dockerfile
    image: fitclub/notification-service:1.0.0
    environment:
      # docker — рабочий режим; docker,demo — учебный стенд (тестовая оплата, demo-данные), см. .env.example
      SPRING_PROFILES_ACTIVE: ${FITCLUB_PROFILES:-docker}
      FITCLUB_SECRETS_DIR: /run/secrets
      # Адрес собственной БД можно заменить, например на отдельный сервер PostgreSQL:
      # FITCLUB_DB_URL: jdbc:postgresql://other-host:5432/notification_db
    secrets:
      - db_notification_password
      - source: jwt_public_key
        target: jwt_public_key.pem
    depends_on:
      postgres-bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/ready >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    restart: unless-stopped

  # --- API Gateway: единая точка входа /api и общий Swagger UI ---
  # Не ждёт готовности сервисов (нет цикла readiness): недоступный сервис даёт контролируемый 503.
  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    image: fitclub/gateway:1.0.0
    environment:
      SPRING_PROFILES_ACTIVE: docker
      FITCLUB_SECRETS_DIR: /run/secrets
    secrets:
      - source: jwt_public_key
        target: jwt_public_key.pem
    ports:
      # API и Swagger UI: http://localhost:8000/swagger-ui.html
      - "127.0.0.1:${GATEWAY_HOST_PORT:-8000}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/ready >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

volumes:
  postgres-data:
  rabbitmq-data:

secrets:
  postgres_admin_password:
    file: ./secrets/postgres_admin_password
  db_auth_password:
    file: ./secrets/db_auth_password
  db_schedule_password:
    file: ./secrets/db_schedule_password
  db_membership_password:
    file: ./secrets/db_membership_password
  db_booking_password:
    file: ./secrets/db_booking_password
  db_payment_password:
    file: ./secrets/db_payment_password
  db_notification_password:
    file: ./secrets/db_notification_password
  rabbitmq_users:
    file: ./secrets/rabbitmq_users.json
  jwt_public_key:
    file: ./secrets/jwt_public_key.pem
  jwt_private_key:
    file: ./secrets/jwt_private_key.pem
  auth_initial_admin_password:
    file: ./secrets/auth_initial_admin_password
  service_token_schedule_to_auth:
    file: ./secrets/service_token_schedule_to_auth
  rabbitmq_schedule_password:
    file: ./secrets/rabbitmq_schedule_password
  rabbitmq_membership_password:
    file: ./secrets/rabbitmq_membership_password
  rabbitmq_payment_password:
    file: ./secrets/rabbitmq_payment_password
  service_token_payment_to_membership:
    file: ./secrets/service_token_payment_to_membership
  service_token_booking_to_membership:
    file: ./secrets/service_token_booking_to_membership
