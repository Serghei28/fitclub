# Одноразовый идемпотентный bootstrap: роль <service>_user и БД <service>_db для каждого сервиса,
# пароли из Secret, REVOKE CONNECT FROM PUBLIC — роль одного сервиса не откроет чужую БД.
# Тот же скрипт, что и в Docker Compose (lab2/infrastructure/postgres/bootstrap-databases.sh),
# он лежит в ConfigMap postgres-bootstrap. Схемы таблиц создаёт Flyway каждого сервиса.
# Повторный запуск: kubectl delete job postgres-bootstrap -n fitclub, затем kubectl apply этого файла.
apiVersion: batch/v1
kind: Job
metadata:
  name: postgres-bootstrap
  namespace: fitclub
  labels:
    app: postgres-bootstrap
    app.kubernetes.io/name: postgres-bootstrap
    app.kubernetes.io/part-of: fitclub
    app.kubernetes.io/component: database
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app: postgres-bootstrap
        app.kubernetes.io/name: postgres-bootstrap
        app.kubernetes.io/part-of: fitclub
        app.kubernetes.io/component: database
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-postgres
          image: postgres:17.11-alpine
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "until pg_isready -h postgres -U postgres; do sleep 2; done"]
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { cpu: 200m, memory: 64Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      containers:
        - name: bootstrap
          image: postgres:17.11-alpine
          imagePullPolicy: IfNotPresent
          command: ["sh", "/bootstrap/bootstrap-databases.sh"]
          env:
            - name: PGHOST
              value: postgres
            - name: PGUSER
              value: postgres
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { cpu: 200m, memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: script
              mountPath: /bootstrap
              readOnly: true
            - name: secrets
              mountPath: /run/secrets
              readOnly: true
      volumes:
        - name: script
          configMap:
            name: postgres-bootstrap
        - name: secrets
          secret:
            secretName: postgres-secrets
            defaultMode: 0440
