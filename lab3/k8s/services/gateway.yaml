# gateway: внутренний адрес http://gateway:8080. Снаружи доступен через frontend (/api) или kubectl port-forward svc/gateway 9000:8080.
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: fitclub
  labels:
    app: gateway
    app.kubernetes.io/name: gateway
    app.kubernetes.io/part-of: fitclub
    app.kubernetes.io/component: backend
spec:
  type: ClusterIP
  selector:
    app: gateway
  ports:
    - name: http
      port: 8080
      targetPort: http
