# frontend: единственный сервис, доступный снаружи кластера.
# NodePort 30080 открывает порт на узле Minikube: minikube service frontend -n fitclub
# (или kubectl port-forward -n fitclub svc/frontend 9080:80).
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: fitclub
  labels:
    app: frontend
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: fitclub
    app.kubernetes.io/component: frontend
spec:
  type: NodePort
  selector:
    app: frontend
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30080
